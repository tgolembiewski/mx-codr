<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Choose your app's look</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --page:#eef1f5;--page-ink:#17202c;--page-muted:#5b6676;--page-card:#ffffff;--page-line:#d9dee6;--page-accent:#264ae5;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--sans:"Poppins",system-ui,sans-serif;
  /* palette driven by the chosen option */
  --brand:#264ae5;--brand-ink:#fff;--rail:#1f3fbf;--rail-active:#16309a;--top:#2a4fe0;
  --a-ground:#f5f6f8;--a-surface:#fff;--a-ink:#14202e;--a-muted:#5a6577;--a-line:#dfe3ea;--a-sel:#eef2f8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#0f141b;--page-ink:#e6ebf2;--page-muted:#97a3b4;--page-card:#161d27;--page-line:#28323f;--page-accent:#8fb0ff}}
:root[data-theme="dark"]{--page:#0f141b;--page-ink:#e6ebf2;--page-muted:#97a3b4;--page-card:#161d27;--page-line:#28323f;--page-accent:#8fb0ff}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--page-ink);font:15px/1.5 var(--sans);padding-inline:16px}
.wrap{max-width:1180px;margin:0 auto;padding-block:24px 40px;display:grid;gap:18px}
h1{margin:0;font-size:clamp(24px,3.4vw,34px);text-wrap:balance}
.lead{margin:0;color:var(--page-muted);max-width:70ch}
.picker{display:flex;flex-wrap:wrap;gap:10px}
.opt{display:flex;align-items:center;gap:10px;border:2px solid var(--page-line);background:var(--page-card);color:var(--page-ink);border-radius:12px;padding:8px 14px 8px 8px;cursor:pointer;font:600 14px var(--sans)}
.opt[aria-pressed="true"]{border-color:var(--page-accent)}
.opt:focus-visible,.copy:focus-visible{outline:2px solid var(--page-accent);outline-offset:2px}
.sw{display:flex;border-radius:8px;overflow:hidden;height:34px}
.sw i{display:block;width:16px}
.opt small{display:block;font:400 12px var(--mono);color:var(--page-muted)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}

/* the chosen theme on a real Mendix app */
.shot{margin:0;border-radius:14px;overflow:hidden;border:1px solid var(--page-line);box-shadow:0 12px 30px rgba(20,30,50,.14);background:var(--page-card)}
.shot img{display:block;width:100%;height:auto}
.shot figcaption{padding:8px 14px;font-size:12px;color:var(--page-muted)}
/* side panel */
.panel{background:var(--page-card);border:1px solid var(--page-line);border-radius:12px;padding:16px;display:grid;gap:12px;position:sticky;top:12px}
.panel h3{margin:0;font-size:18px}
.panel p{margin:0;color:var(--page-muted);font-size:13px}
.vals{display:grid;gap:6px;font:13px var(--mono)}
.vals div{display:flex;align-items:center;gap:8px}
.vals i{width:18px;height:18px;border-radius:4px;border:1px solid rgba(0,0,0,.15)}
.vals em{font-style:normal;color:var(--page-muted)}
.contrast{font-size:13px}
.ok{color:#1f7a3d;font-weight:600}.bad{color:#b42318;font-weight:600}
pre{margin:0;background:#0f1722;color:#dce6f2;border-radius:8px;padding:10px 12px;font:12px/1.55 var(--mono);white-space:pre-wrap;word-break:break-all}
.copy{justify-self:start;font:600 13px var(--sans);border:1px solid var(--page-line);background:var(--page-card);color:var(--page-ink);border-radius:8px;padding:6px 12px;cursor:pointer}
.num-badge{display:grid;place-items:center;width:26px;height:26px;border-radius:7px;background:var(--page-ink);color:var(--page);font:700 14px var(--sans);flex:none}
.type{font-size:15px;font-weight:600}.type code{font:700 15px var(--mono);background:var(--page);padding:2px 8px;border-radius:6px}
.tag{font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--page-accent)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Choose your app's look</h1>
  <p class="lead">Each picture is a real Mendix app in that theme: the side menu, the top bar, the buttons, a list and a form. Pick one here, then type its number in the terminal. You can change it later in seconds with <code>node .mxcodr/theme.mjs</code>.</p>
  <div class="picker" id="picker" role="group" aria-label="Theme"></div>
  <div class="layout">
    <figure class="shot">
      <img id="shot" alt="" width="1024" height="640">
      <figcaption id="shotcap"></figcaption>
    </figure>
    <aside class="panel">
      <h3 id="pname"></h3>
      <p id="pdesc"></p>
      <div class="type" id="ptype"></div>
      <div class="vals" id="pvals"></div>
    </aside>
  </div>
</div>
<script>
var CATALOG = [{"name": "atlas", "title": "Mendix Atlas", "description": "Mendix's own Atlas look -- blue frame, no mxcli theme", "source": "none", "frame": {"top": "#2a4fe0", "rail-active": "#16309a"}, "light": {"brand": "#264ae5", "brand-hover": "#1d3bc0", "brand-ink": "#ffffff", "ground": "#f6f7fa", "surface": "#ffffff", "surface-alt": "#f8f9fb", "surface-hover": "#eef1fb", "surface-selected": "#e4e9fc", "ink": "#0a1325", "ink-muted": "#5b6676", "ink-faint": "#98a2b3", "line": "#ced0d3", "rail": "#1f3fbf", "rail-ink": "#e3e8ef", "rail-ink-active": "#ffffff", "success": "#3cb33d", "warning": "#eca51c", "danger": "#e33f4e", "radius": "4px", "font": "\"Open Sans\", sans-serif", "font-heading": "\"Open Sans\", sans-serif"}, "dark": {"brand": "#264ae5", "brand-hover": "#1d3bc0", "brand-ink": "#ffffff", "ground": "#f6f7fa", "surface": "#ffffff", "surface-alt": "#f8f9fb", "surface-hover": "#eef1fb", "surface-selected": "#e4e9fc", "ink": "#0a1325", "ink-muted": "#5b6676", "ink-faint": "#98a2b3", "line": "#ced0d3", "rail": "#1f3fbf", "rail-ink": "#e3e8ef", "rail-ink-active": "#ffffff", "success": "#3cb33d", "warning": "#eca51c", "danger": "#e33f4e", "radius": "4px", "font": "\"Open Sans\", sans-serif", "font-heading": "\"Open Sans\", sans-serif"}}, {"name": "navy", "title": "Navy", "description": "Ink navy -- calm and businesslike, for finance and back office", "source": "navy.css", "frame": {"top": "#1b3354", "rail-active": "#24456f"}, "light": {"brand": "#1f3a5f", "brand-hover": "#172c48", "brand-ink": "#ffffff", "ground": "#f5f6f8", "surface": "#ffffff", "surface-alt": "#f9fafb", "surface-hover": "#f2f3f5", "surface-selected": "#e4e7ec", "ink": "#14202e", "ink-muted": "#5a6577", "ink-faint": "#98a2b3", "line": "#dfe3ea", "rail": "#14263f", "rail-ink": "#e3e8ef", "rail-ink-active": "#ffffff", "success": "#1f7a4d", "warning": "#b45309", "danger": "#b42318", "radius": "4px", "font": "\"IBM Plex Sans\", system-ui, -apple-system, \"Segoe UI\", sans-serif", "font-heading": "var(--mxt-font)"}, "dark": {"brand": "#8493a7", "brand-hover": "#a5b0bf", "brand-ink": "#0b1018", "ground": "#0f141b", "surface": "#161d27", "surface-alt": "#1a2230", "surface-hover": "#1f2836", "surface-selected": "#1a2a40", "ink": "#e6ebf2", "ink-muted": "#97a3b4", "ink-faint": "#6b7787", "line": "#28323f", "rail": "#14263f", "rail-ink": "#e3e8ef", "rail-ink-active": "#ffffff", "success": "#3fb950", "warning": "#d29922", "danger": "#f85149", "radius": "4px", "font": "\"IBM Plex Sans\", system-ui, -apple-system, \"Segoe UI\", sans-serif", "font-heading": "var(--mxt-font)"}}, {"name": "teal", "title": "Teal", "description": "Deep teal -- fresh and confident, actions stand out", "source": "teal.css", "frame": {"top": "#0c6766", "rail-active": "#14595a"}, "light": {"brand": "#0e7c7b", "brand-hover": "#0a5f5e", "brand-ink": "#ffffff", "ground": "#f5f6f8", "surface": "#ffffff", "surface-alt": "#f9fafb", "surface-hover": "#f1f7f7", "surface-selected": "#e2efef", "ink": "#14202e", "ink-muted": "#5a6577", "ink-faint": "#98a2b3", "line": "#dfe3ea", "rail": "#0b3b3f", "rail-ink": "#e3e8ef", "rail-ink-active": "#ffffff", "success": "#1f7a4d", "warning": "#b45309", "danger": "#b42318", "radius": "4px", "font": "\"IBM Plex Sans\", system-ui, -apple-system, \"Segoe UI\", sans-serif", "font-heading": "var(--mxt-font)"}, "dark": {"brand": "#7ab7b6", "brand-hover": "#9fcbca", "brand-ink": "#0b1018", "ground": "#0f141b", "surface": "#161d27", "surface-alt": "#1a2230", "surface-hover": "#1f2836", "surface-selected": "#12484d", "ink": "#e6ebf2", "ink-muted": "#97a3b4", "ink-faint": "#6b7787", "line": "#28323f", "rail": "#0b3b3f", "rail-ink": "#e3e8ef", "rail-ink-active": "#ffffff", "success": "#3fb950", "warning": "#d29922", "danger": "#f85149", "radius": "4px", "font": "\"IBM Plex Sans\", system-ui, -apple-system, \"Segoe UI\", sans-serif", "font-heading": "var(--mxt-font)"}}, {"name": "amber", "title": "Amber", "description": "Graphite frame with warm amber actions -- modern, high contrast", "source": "amber.css", "frame": {"top": "#2e3440", "rail-active": "#434c5e"}, "light": {"brand": "#b45309", "brand-hover": "#92400e", "brand-ink": "#ffffff", "ground": "#f5f6f8", "surface": "#ffffff", "surface-alt": "#f9fafb", "surface-hover": "#faf5f0", "surface-selected": "#f6eae1", "ink": "#14202e", "ink-muted": "#5a6577", "ink-faint": "#98a2b3", "line": "#dfe3ea", "rail": "#2e3440", "rail-ink": "#e3e8ef", "rail-ink-active": "#ffffff", "success": "#1f7a4d", "warning": "#b45309", "danger": "#b42318", "radius": "4px", "font": "\"IBM Plex Sans\", system-ui, -apple-system, \"Segoe UI\", sans-serif", "font-heading": "var(--mxt-font)"}, "dark": {"brand": "#d6a078", "brand-hover": "#e1ba9d", "brand-ink": "#0b1018", "ground": "#0f141b", "surface": "#161d27", "surface-alt": "#1a2230", "surface-hover": "#1f2836", "surface-selected": "#5d351a", "ink": "#e6ebf2", "ink-muted": "#97a3b4", "ink-faint": "#6b7787", "line": "#28323f", "rail": "#2e3440", "rail-ink": "#e3e8ef", "rail-ink-active": "#ffffff", "success": "#3fb950", "warning": "#d29922", "danger": "#f85149", "radius": "4px", "font": "\"IBM Plex Sans\", system-ui, -apple-system, \"Segoe UI\", sans-serif", "font-heading": "var(--mxt-font)"}}, {"name": "plum", "title": "Plum", "description": "Plum -- distinctive and premium without being loud", "source": "plum.css", "frame": {"top": "#4a2f5c", "rail-active": "#56366a"}, "light": {"brand": "#5b3a70", "brand-hover": "#472c58", "brand-ink": "#ffffff", "ground": "#f5f6f8", "surface": "#ffffff", "surface-alt": "#f9fafb", "surface-hover": "#f5f3f6", "surface-selected": "#ebe7ee", "ink": "#14202e", "ink-muted": "#5a6577", "ink-faint": "#98a2b3", "line": "#dfe3ea", "rail": "#3b2449", "rail-ink": "#e3e8ef", "rail-ink-active": "#ffffff", "success": "#1f7a4d", "warning": "#b45309", "danger": "#b42318", "radius": "4px", "font": "\"IBM Plex Sans\", system-ui, -apple-system, \"Segoe UI\", sans-serif", "font-heading": "var(--mxt-font)"}, "dark": {"brand": "#a593b0", "brand-hover": "#bdb0c6", "brand-ink": "#0b1018", "ground": "#0f141b", "surface": "#161d27", "surface-alt": "#1a2230", "surface-hover": "#1f2836", "surface-selected": "#352a48", "ink": "#e6ebf2", "ink-muted": "#97a3b4", "ink-faint": "#6b7787", "line": "#28323f", "rail": "#3b2449", "rail-ink": "#e3e8ef", "rail-ink-active": "#ffffff", "success": "#3fb950", "warning": "#d29922", "danger": "#f85149", "radius": "4px", "font": "\"IBM Plex Sans\", system-ui, -apple-system, \"Segoe UI\", sans-serif", "font-heading": "var(--mxt-font)"}}, {"name": "forest", "title": "Forest", "description": "Forest green -- grounded and trustworthy", "source": "forest.css", "frame": {"top": "#27592f", "rail-active": "#2e5e37"}, "light": {"brand": "#2f6b3a", "brand-hover": "#24532d", "brand-ink": "#ffffff", "ground": "#f5f6f8", "surface": "#ffffff", "surface-alt": "#f9fafb", "surface-hover": "#f3f6f3", "surface-selected": "#e6ede7", "ink": "#14202e", "ink-muted": "#5a6577", "ink-faint": "#98a2b3", "line": "#dfe3ea", "rail": "#1f4527", "rail-ink": "#e3e8ef", "rail-ink-active": "#ffffff", "success": "#1f7a4d", "warning": "#b45309", "danger": "#b42318", "radius": "4px", "font": "\"IBM Plex Sans\", system-ui, -apple-system, \"Segoe UI\", sans-serif", "font-heading": "var(--mxt-font)"}, "dark": {"brand": "#8dae93", "brand-hover": "#acc4b0", "brand-ink": "#0b1018", "ground": "#0f141b", "surface": "#161d27", "surface-alt": "#1a2230", "surface-hover": "#1f2836", "surface-selected": "#214030", "ink": "#e6ebf2", "ink-muted": "#97a3b4", "ink-faint": "#6b7787", "line": "#28323f", "rail": "#1f4527", "rail-ink": "#e3e8ef", "rail-ink-active": "#ffffff", "success": "#3fb950", "warning": "#d29922", "danger": "#f85149", "radius": "4px", "font": "\"IBM Plex Sans\", system-ui, -apple-system, \"Segoe UI\", sans-serif", "font-heading": "var(--mxt-font)"}}];
var root = document.documentElement, pk = document.getElementById('picker'), current = 0;
CATALOG.forEach(function (t, i) {
  var b = document.createElement('button'); b.type = 'button'; b.className = 'opt'; b.id = 'opt-' + t.name;
  b.innerHTML = '<span class="num-badge">' + (i + 1) + '</span><span class="sw"><i style="background:' + t.light.rail + '"></i><i style="background:' + t.frame.top + '"></i><i style="background:' + t.light.brand + '"></i></span><span>' + t.title + (i === 0 ? ' <span class="tag">default</span>' : '') + '<small>' + (t.source === 'none' ? 'Mendix standard' : 'mx-codr') + '</small></span>';
  b.onclick = function () { current = i; show(); }; pk.appendChild(b);
});
function show() {
  var t = CATALOG[current], k = t.light, f = t.frame;
  var img = document.getElementById('shot');
  img.src = 'shots/' + t.name + '.jpg';
  img.alt = t.title + ' theme on a Mendix app';
  document.getElementById('shotcap').textContent = 'A running Mendix app in ' + t.title + '.';
  [].slice.call(pk.children).forEach(function (b) { b.setAttribute('aria-pressed', b.id === 'opt-' + t.name); });
  document.getElementById('pname').textContent = t.title;
  document.getElementById('pdesc').textContent = t.description.replace(/ -- /g, ' — ');
  document.getElementById('ptype').innerHTML = 'In the terminal, type <code>' + (current + 1) + '</code> and press Enter.';
  var rows = [['Buttons, links', k.brand], ['Side menu', k.rail], ['Top bar', f.top], ['Page', k.ground]];
  document.getElementById('pvals').innerHTML = rows.map(function (r) { return '<div><i style="background:' + r[1] + '"></i>' + r[1] + ' <em>' + r[0] + '</em></div>'; }).join('');
}
show();
</script>
